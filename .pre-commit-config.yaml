# Local hooks only: they run tools the bootstrap already installs.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: bats
        name: bats test/
        entry: bats test/
        language: system
        pass_filenames: false
        always_run: true
      - id: gofmt
        name: gofmt
        entry: sh -c 'unformatted=$(gofmt -l "$@"); [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }' --
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        always_run: true
